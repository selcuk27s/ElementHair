# Veröffentlicht den Ordner website/ automatisch auf GitHub Pages,
# sobald etwas auf den Branch main hochgeladen wird.
name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4
      - name: Pages vorbereiten
        uses: actions/configure-pages@v5
      - name: Ordner website/ hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
